[project]
name = "money-transfer"
version = "0.1.0"
description = "A small money transfer API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
